<!-- Ícono de la app: el monograma AP (11-oct-2026). La A es la triangulación
     con su punto focal arriba; la P, una página del manual con la esquina
     doblada. Fondo claro, trazo grafito y un solo punto rojo.
     Los PNG, og.jpg y el banner salen de aquí con `node design/iconos.mjs`.
     Todo el dibujo cabe en la zona segura de «maskable» (el círculo central
     de 80 %): el punto más lejano del centro está a 201 px de 205. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#EEF0F3"/>
  <!-- el punto focal -->
  <circle cx="188" cy="142" r="20" fill="#E5333A"/>
  <!-- A: la triangulación -->
  <path d="M124 376 L188 200 L252 376 Z" fill="none" stroke="#111318" stroke-width="32" stroke-linejoin="round"/>
  <!-- P: la lámina, con la esquina cortada como página doblada -->
  <path d="M308 376 V200 H336 L386 250 V256 A40 40 0 0 1 346 296 H308" fill="none" stroke="#111318" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
