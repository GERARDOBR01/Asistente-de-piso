# Corre el arnés de la app (index.html?test=1) en cada push a main y en cada
# pull request. El package.json es solo para desarrollo (sus devDependencies
# pesan: transformers.js trae onnxruntime), así que aquí no se corre npm ci:
# Playwright se instala solo, sin guardarse.
name: arnés

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arnes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright, Chromium, fast-check y TypeScript
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 fast-check@4.10.2 typescript@5.9.3
          npx playwright install --with-deps chromium
      - name: Tipos del motor (tsc --checkJs, sin compilar)
        run: npx tsc -p .
      # Lo que sí usa el navegador (Revisar, IndexedDB), con lib dom y aparte:
      # el motor sigue sin poder tocar la pantalla.
      - name: Tipos de lo que usa el navegador
        run: npx tsc -p tsconfig.dom.json
      - name: Pruebas en Node (laboratorio, frontera del motor y propiedades)
        run: node --test "lab/*.test.mjs"
      - name: Arnés
        run: node eval/arnes.mjs
      # Revisar de punta a punta como la usa la persona (celular y escritorio),
      # con las imágenes de demo.js: sin fotos reales ni modelos que bajar.
      - name: Pantalla de Revisar
        run: node eval/revisar-pantalla.mjs
      # Como GitHub Pages (max-age=600): una versión nueva tiene que llegar
      # entera a la página y a la caché sin señal, sin mezclar archivos viejos.
      - name: Despliegue del service worker
        run: node eval/despliegue-sw.mjs
      - name: Agente lector contra proveedores simulados
        run: node eval/agente-simulado.mjs
      # La app real contra los manuales ficticios de eval/corpus-publico: falla si
      # una pregunta que estaba bien pasa a mal. El informe queda en el resumen del job.
      - name: eval-gate (corpus público)
        run: node lab/gate.mjs
